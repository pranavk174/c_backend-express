directive @isChatMember on FIELD_DEFINITION

enum delete_type {
  onlyme
  ONLYME
  OnlyMe
  Everyone
  everyone
  EVERYONE
}
type Chats {
  chat_id: Int!
  user_id: Int!
  profile_pic: String
  last_message: String
  last_message_at: String
  name: String!
  chat_type: String!
}

type emoji {
  react_id: Int!
  emoji: String!
}

type Emojis {
  items: [emoji]!
}

type reaction {
  react_id: Int!
  user_id: Int!
}

type Chat {
  id: Int!
  sender_id: Int!
  created_at: String!
  seen_at: String
  is_forwarded: Boolean!
  preview: String
  content: String
  seen_users: [Int]
  story_id: Int
  is_edited: Boolean!
  reply_to_message_id: Int
  is_deleted: Boolean
  reactions: [reaction]!
}

# type reactions {
#   items: [reaction]!
# }

type SingleChat {
  items: [Chat]
  hasMore: Boolean!
  nextCursor: Int
}
type AllChats {
  items: [Chats]
}

union ChatResponse = SingleChat | AllChats | Emojis

type chatApiResponse implements apiResponse {
  message: String!
  status: Int!
  success: Boolean!
  error: String
  data: ChatResponse
}

input Media {
  url: String!
  file_name: String!
  file_type: FileType!
  file_size: String!
}

input ChatInput {
  reciever_ids: [Int!]
  chat_ids: [Int!]
  message_ids: [Int!]
  delete_type: delete_type
  cursor: Int
  hasMore: Boolean
  limit: Int
  content: String
  reaction_id: Int
  media: [Media!]
}

extend type Query {
  getChatById(input: ChatInput!): chatApiResponse! @auth @isChatMember
  getAllChats: chatApiResponse! @auth
  getEmojis: chatApiResponse!
}

extend type Mutation {
  sendMessage(input: ChatInput!): chatApiResponse! @auth
  editMessage(input: ChatInput!): chatApiResponse! @auth @isChatMember
  deleteMessage(input: ChatInput!): chatApiResponse! @auth @isChatMember
  replyMessage(input: ChatInput!): chatApiResponse! @auth @isChatMember
  reactMessage(input: ChatInput!): chatApiResponse! @auth @isChatMember
  forwardMessage(input: ChatInput!): chatApiResponse! @auth @isChatMember
  seenMessage(input: ChatInput!): chatApiResponse! @auth @isChatMember
}
