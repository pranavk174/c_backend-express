type Chats {
  chat_id: String!
  user_id: ID!
  profile_pic: String
  last_message: String
  last_message_at: String
  name: String!
  chat_type: String!
}

type Chat {
  id: ID!
  sender_id: Int!
  created_at: String!
  seen_at: String
  is_forwarded: Boolean!
  content: String
  story_id: Int
  is_edited: Boolean!
  reply_to_message: Int
  is_deleted: Boolean
}

type SingleChat {
  items: [Chat]
}
type AllChats {
  items: [Chats]
}

union ChatResponse = SingleChat | AllChats

type chatApiResponse implements apiResponse {
  message: String!
  status: Int!
  success: Boolean!
  error: String
  data: ChatResponse
}

input Media {
  url: String!
  file_name: String!
  file_type: FileType!
  file_size: String!
}

input ChatInput {
  reciever_id: ID!
  chat_id: Int
  content: String
  media: [Media!]
}

extend type Query {
  getChatById(chat_id: ID!): chatApiResponse! @auth
  getAllChats: chatApiResponse! @auth
}

extend type Mutation {
  sendMessage(input: ChatInput): chatApiResponse! @auth
}
