interface Email {
  email: String!
}

type Otp implements Email {
  email: String!
  otp: String!
}

type User implements Email {
  name: String!
  id: Int!
  user_name: String!
  email: String!
  bio: String
  mobile: String!
  profile_pic: String
  cover_pic: String
}

type Users {
  items: [User]!
}

input UserInput {
  fname: String!
  lname: String!
  user_name: String!
  email: String!
  bio: String
  mobile: String!
  profile_pic: String
  cover_pic: String
}

input UpdateUserInput {
  name: String
  bio: String
  cover_pic: String
  profile_pic: String
}

type notification {
  notification_id: Int!
  notification_type: String!
  name: String!
  message: String!
  time: String!
  profile_pic: String
  reference_id: Int
  # color: "#ff4d6d",
}

type notifications {
  items: [notification]!
}

type verifyOtpData {
  email: String!
  id: Int!
  is_verified: Boolean
}
union ResponseData = Users | User | verifyOtpData | notifications
type userApiResponse implements apiResponse {
  message: String!
  status: Int!
  success: Boolean
  data: ResponseData
  error: String
}

input verifyOtpInput {
  email: String!
  otp: String!
  device_id: String!
  ip_address: String!
  location: String!
  device_name: String!
}

enum AccountStatus {
  delete
  DELETE
  suspend
  SUSPEND
}

input blockUserInput {
  blocked_user_id: Int!
  reason: String
}

extend type Query {
  getUser: userApiResponse! @auth
  getUsers: userApiResponse! @auth
  getNotification: userApiResponse! @auth
}

extend type Mutation {
  sendOtpMail(email: String!): userApiResponse!
  verifyOtp(input: verifyOtpInput): userApiResponse!
  createUser(input: UserInput): userApiResponse!
  updateUser(input: UpdateUserInput): userApiResponse! @auth
  generateRefreshToken: userApiResponse!
  logout: userApiResponse! @auth
  deleteUser(action_type: AccountStatus!): userApiResponse! @auth
  blockUser(input: blockUserInput!): userApiResponse! @auth
  unBlockUser(input: blockUserInput!): userApiResponse! @auth
  # loginUser(email:String!):userApiResponse!
}
