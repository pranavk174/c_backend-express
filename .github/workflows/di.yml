name: Deploy Backend To Netlify

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Create .env
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "DIRECT_URL=${{ secrets.DIRECT_URL }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
      
      - name: Setup Prisma
        run: "node -e \"console.log(process.env.DIRECT_URL ? 'DIRECT_URL exists' : 'DIRECT_URL missing')\" && npm install && npx prisma db pull && npx prisma generate"

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy To Netlify
      
        run: |
          netlify deploy \
          --prod \
          --dir .
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
